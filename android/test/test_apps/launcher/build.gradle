apply plugin: 'com.android.application'

android {
    compileSdkVersion 34
    namespace = 'com.lunarg.gfxreconstruct.test.test_apps.test_launcher'
    ndkVersion = '26.3.11579264'
    defaultConfig {
        applicationId "com.lunarg.gfxreconstruct.test.test_apps.test_launcher"
        minSdkVersion 26
        targetSdkVersion 33
        versionCode 1
        versionName "1.0"
        ndk {
            if (project.hasProperty("armeabi-v7a")) {
                abiFilters 'armeabi-v7a'
            } else if (project.hasProperty("arm64-v8a")) {
                abiFilters 'arm64-v8a'
            } else if (project.hasProperty("x86")) {
                abiFilters 'x86'
            } else if (project.hasProperty("x86_64")) {
                abiFilters 'x86_64'
            } else {
                abiFilters 'arm64-v8a', 'x86_64'
            }
        }
        externalNativeBuild {
            cmake {
                // Build only the test launcher library from the repository-root
                // CMakeLists.txt (see the module-level externalNativeBuild below).
                // Test app targets are only defined when GFXRECON_INCLUDE_TEST_APPS
                // is enabled.
                targets "gfxrecon-test-launcher"
                cppFlags "-fexceptions", "-Wno-nullability-completeness"
                arguments "-DANDROID_TOOLCHAIN=clang", "-DANDROID_STL=c++_static", "-DGFXRECON_INCLUDE_TEST_APPS=ON"
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    externalNativeBuild {
        cmake {
            // Repository-root CMakeLists.txt: one CMake tree shared between
            // desktop and Android builds.
            path "../../../../CMakeLists.txt"
        }
    }
    sourceSets {
        main {
            assets.srcDirs = ['../../../../test/test_apps/res']
        }
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
}
